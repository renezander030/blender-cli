name: Publish reviewed release
on:
  workflow_run:
    workflows: [Blender conformance]
    types: [completed]
    branches: [master]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - name: Confirm the owner merged this tested release
        id: review
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const {owner, repo} = context.repo;
            const {data: pulls} = await github.rest.repos.listPullRequestsAssociatedWithCommit({owner, repo, commit_sha: sha});
            let approved = null;
            for (const item of pulls) {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: item.number});
              if (pr.merged_at && pr.merge_commit_sha === sha && pr.base.ref === 'master' &&
                  pr.merged_by?.login === owner && pr.head.ref.startsWith('release/v')) {
                approved = pr; break;
              }
            }
            core.setOutput('approved', String(Boolean(approved)));
            if (approved) core.setOutput('version', approved.head.ref.slice('release/v'.length));
            else core.notice('No owner-merged release PR matches this tested commit; nothing will be published.');
      - uses: actions/checkout@v4
        if: steps.review.outputs.approved == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.review.outputs.approved == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Prepare the exact tested package and release notes
        if: steps.review.outputs.approved == 'true'
        env:
          RELEASE_VERSION: ${{ steps.review.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || { echo 'Existing release tag points to a different commit'; exit 1; }
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'blender-cli' || pkg.version !== process.env.RELEASE_VERSION || !/^\d+\.\d+\.\d+$/.test(pkg.version)) throw new Error('Release branch and package version must match');
          const header = new RegExp('^## ' + pkg.version.replaceAll('.', '\\.') + ' \\([^\\n]*\\)\\n', 'm');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const match = header.exec(text);
          if (!match) throw new Error('Missing changelog entry');
          const notes = text.slice(match.index + match[0].length).split(/^## /m)[0].trim();
          fs.writeFileSync('release-notes.txt', notes + '\n\nValidation: the complete suite passed on Blender 4.3.2 and 5.2.0.\n');
          JS
          npm pack --json > pack.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const [pack] = JSON.parse(fs.readFileSync('pack.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=${pack.filename}\nRELEASE_INTEGRITY=${pack.integrity}\n`);
          JS
      - name: Publish npm package with provenance
        if: steps.review.outputs.approved == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'NPM_TOKEN repository secret is required'; exit 1; }
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
          if (response.status === 404) process.exit(0);
          if (!response.ok) throw new Error(`npm metadata request failed: ${response.status}`);
          const published = await response.json();
          if (published.dist?.integrity !== process.env.RELEASE_INTEGRITY) throw new Error('This version already exists with different package contents');
          fs.writeFileSync('already-published', 'yes');
          JS
          if [ ! -f already-published ]; then
            npm publish "$RELEASE_TARBALL" --access public --provenance
          fi
      - name: Create GitHub release and attach package checksums
        if: steps.review.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.review.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || { echo 'Existing release tag points to a different commit'; exit 1; }
          fi
          sha256sum "$RELEASE_TARBALL" > SHA256SUMS
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$RELEASE_TARBALL" SHA256SUMS --target "$RELEASE_SHA" --title "$tag" --notes-file release-notes.txt
          fi
