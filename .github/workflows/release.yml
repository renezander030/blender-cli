name: Publish reviewed release
# A pushed vX.Y.Z tag publishes that commit to npm, once it passed the Blender conformance suite on master; the tag is
# the release, as in the other npm repos, so the npm trust proof runs before any tag and a merge publishes nothing.
on:
  push:
    tags:
      - 'v*'
  # Proof only, no publish: npm trusts this workflow file whatever its trigger, so a manual run exchanges the
  # job's OIDC token and says whether npm would take the publish (.github/scripts/npm-trust-proof.mjs).
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  npm-trust-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges; nothing is published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Exchange the OIDC token with npm for the package
        run: node .github/scripts/npm-trust-proof.mjs --out npm-trust-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-trust-proof
          path: npm-trust-proof.json

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Confirm the tagged commit passed the Blender conformance suite on master
        id: review
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', branch: 'master', status: 'success'});
            if (!data.workflow_runs.length) core.setFailed(`No successful Blender conformance run on master for ${sha}; tag a tested master commit.`);
            core.setOutput('approved', String(data.workflow_runs.length > 0));
            core.setOutput('version', context.ref.replace('refs/tags/v', ''));
      - uses: actions/checkout@v4
        if: steps.review.outputs.approved == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.review.outputs.approved == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Prepare the exact tested package and release notes
        if: steps.review.outputs.approved == 'true'
        env:
          RELEASE_VERSION: ${{ steps.review.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || { echo 'Existing release tag points to a different commit'; exit 1; }
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'blender-cli' || pkg.version !== process.env.RELEASE_VERSION || !/^\d+\.\d+\.\d+$/.test(pkg.version)) throw new Error('Release branch and package version must match');
          const header = new RegExp('^## ' + pkg.version.replaceAll('.', '\\.') + ' \\([^\\n]*\\)\\n', 'm');
          const text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const match = header.exec(text);
          if (!match) throw new Error('Missing changelog entry');
          const notes = text.slice(match.index + match[0].length).split(/^## /m)[0].trim();
          fs.writeFileSync('release-notes.txt', notes + '\n\nValidation: the complete suite passed on Blender 4.3.2 and 5.2.0.\n');
          JS
          npm pack --json > pack.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const [pack] = JSON.parse(fs.readFileSync('pack.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_TARBALL=${pack.filename}\nRELEASE_INTEGRITY=${pack.integrity}\n`);
          JS
      - name: npm 11 for trusted publishing
        if: steps.review.outputs.approved == 'true'
        run: npm install -g npm@11.12.1
      - name: Publish npm package with provenance (trusted publishing, no token)
        if: steps.review.outputs.approved == 'true'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${pkg.name}/${pkg.version}`);
          if (response.status === 404) process.exit(0);
          if (!response.ok) throw new Error(`npm metadata request failed: ${response.status}`);
          const published = await response.json();
          if (published.dist?.integrity !== process.env.RELEASE_INTEGRITY) throw new Error('This version already exists with different package contents');
          fs.writeFileSync('already-published', 'yes');
          JS
          if [ ! -f already-published ]; then
            npm publish "$RELEASE_TARBALL" --access public --provenance
          fi
      - name: Create GitHub release and attach package checksums
        if: steps.review.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.review.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="v${RELEASE_VERSION}"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$RELEASE_SHA" || { echo 'Existing release tag points to a different commit'; exit 1; }
          fi
          sha256sum "$RELEASE_TARBALL" > SHA256SUMS
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$RELEASE_TARBALL" SHA256SUMS --target "$RELEASE_SHA" --title "$tag" --notes-file release-notes.txt
          fi
